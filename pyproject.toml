[project]
name = "python-racing-car"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sosow0212", email = "sosow0212@naver.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.1.1",
]

[project.scripts]
python-racing-car = "python_racing_car:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]